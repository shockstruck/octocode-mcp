name: CI - Lint, Build & Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/octocode-engine

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.4'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check workspace health
        run: yarn health:check

      - name: Verify docs
        run: yarn docs:verify

      # Build before consumer lint and typecheck: packages consume their siblings'
      # compiled output (e.g. @octocodeai/octocode-engine subpath exports map to
      # ./dist/*, which is gitignored). `yarn typecheck` only runs `tsc --noEmit`
      # and never emits that dist, so a fresh checkout needs this single build first.
      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Verify build outputs
        run: node scripts/workspace-health.mjs check-outputs

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        working-directory: packages/octocode-engine
        run: cargo audit -D unmaintained -D unsound -D yanked

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-reports
          path: packages/*/coverage/
          retention-days: 7
